<!DOCTYPE html>
<html lang="en">
      <head>
   <title>Creating task</title>
   <link rel="stylesheet" href="CSS/AddorDeleteTask.css">

  </head>
<body>

    <h1 id ="pageTitle">Creating new task</h1>

    <label for="SetDate">Date:</label>
	<input type="date" id="SetDate" name="SetDate">
    <br><br>
	<label for="NameOfTask">Title:</label>
    <textarea id="NameOfTask" name="NameOfTask" cols="20" rows="1"></textarea>
    <br><br>
    <label for="Goal">Goal:</label> 
	<textarea id="Goal" name="Goal" cols="35" rows="1"></textarea>
    <br><br>
    <label for="Deadline">Deadline:</label>
	<input type="time" id="Deadline" name="Deadline">
    <br><br>
	<button id="tasksubmit">Add Task</button>
	
	<p> Task submitted:</p>
	<p> Date of Task: <span id="output-date"></span></p>
	<p> Title of Task: <span id="output-name"></span></p>
	<p> Goal of Task: <span id="output-goal"></span></p>
	<p> Deadline Time: <span id="output-deadline"></span> </p>
	
	<br><br>
	
	<button id="btnMain">Main page</button>
	<button id="btnCalendar">Calendar</button>
	<button id="btnCurrentTask">View Current Tasks</button>
	<button id="btnTaskManual">Task Manual</button>
	<button id="btnLearnAboutUs">Learn About The Developers</button>

       <script src="scripts/AddorDeleteTask.js"></script>
</body>
</html>
